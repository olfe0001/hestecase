name: hestecase
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stald
      POSTGRES_PASSWORD: stald_demo
      POSTGRES_DB: stald
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stald -d stald"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://stald:stald_demo@db:5432/stald
      PORT: 3001
      NODE_ENV: production
    ports:
      - "127.0.0.1:${APP_PORT:-3005}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
